<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In - Conference Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 text-gray-900">
    <nav class="bg-blue-700 p-4 shadow-lg">
      <div class="container mx-auto flex justify-between items-center">
        <h1 class="text-white text-2xl font-bold">Conference Hub</h1>
        <ul class="flex space-x-4 items-center">
          <li><a href="/" class="text-white hover:text-gray-200">Home</a></li>
          <li>
            <a href="/about" class="text-white hover:text-gray-200">About</a>
          </li>
          <li>
            <a href="/contact" class="text-white hover:text-gray-200"
              >Contact</a
            >
          </li>
          <li>
            <a
              href="/login"
              class="bg-white text-blue-700 px-4 py-2 rounded hover:bg-gray-200"
              >Log In</a
            >
          </li>
          <li>
            <a
              href="/signup"
              class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600"
              >Sign Up</a
            >
          </li>
        </ul>
      </div>
    </nav>

    <div class="container mx-auto p-8 max-w-md">
      <h2 class="text-3xl font-bold mb-4 text-center">Log In</h2>
      <form
        action="/login"
        method="POST"
        class="bg-white p-6 rounded-lg shadow-md"
      >
        <div class="mb-4">
          <label class="block text-sm font-medium mb-2">Email</label>
          <input
            type="email"
            class="w-full p-2 border rounded"
            placeholder="your@email.com"
            required
          />
        </div>
        <div class="mb-4">
          <label class="block text-sm font-medium mb-2">Password</label>
          <input
            type="password"
            class="w-full p-2 border rounded"
            placeholder="Password"
            required
          />
        </div>
        <button
          type="submit"
          class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-700"
        >
          Log In
        </button>
      </form>
      <p class="text-center mt-4">
        Don't have an account?
        <a href="/signup" class="text-blue-600 hover:underline">Sign Up</a>
      </p>
    </div>
  </body>
</html>
